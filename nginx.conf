events {
    worker_connections 1024;
}

http {

    # ── Redirigir HTTP → HTTPS ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name TU_DOMINIO.com;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS + proxy al backend ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name TU_DOMINIO.com;

        ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # ── REST API ───────────────────────────────────────────────────────────
        location / {
            proxy_pass         http://backend:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── WebSocket (STOMP) ──────────────────────────────────────────────────
        # Los headers Upgrade + Connection son obligatorios para el handshake WS
        # proxy_read_timeout largo para que conexiones idle no se corten
        location /ws {
            proxy_pass          http://backend:8080;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }
    }
}
